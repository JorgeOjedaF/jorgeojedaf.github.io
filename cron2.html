<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cronómetro</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background: white;

        font-family: Arial, sans-serif;
        color: #111827;

        transition: background-color 0.25s ease;
    }

    .container {
        text-align: center;
    }

    .title {
        font-size: 18px;
        color: #6b7280;
        margin-bottom: 20px;
    }

    .timer {
        font-family: "Courier New", monospace;
        font-size: 72px;
        font-weight: bold;
        letter-spacing: 4px;
        color: #111827;
    }

</style>
</head>

<body>

<div class="container">

    <div class="title">Cronómetro</div>

    <div class="timer" id="timer">
        00:00:00
    </div>

</div>

<script>

const timer = document.getElementById("timer");

const startTime = performance.now();

const colors = [
    "#ffffff",
    "#fef3c7",
    "#dbeafe",
    "#dcfce7",
    "#fce7f3",
    "#ede9fe",
    "#cffafe",
    "#ffedd5"
];

let lastSecond = -1;

function updateTimer() {

    const elapsedTime = performance.now() - startTime;

    const totalCentiseconds = Math.floor(elapsedTime / 10);

    const minutes = Math.floor(totalCentiseconds / 6000);

    const seconds = Math.floor(
        (totalCentiseconds % 6000) / 100
    );

    const centiseconds = totalCentiseconds % 100;

    timer.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0") + ":" +
        String(centiseconds).padStart(2, "0");

    // Cambiar el fondo solamente cuando cambia el segundo
    if (seconds !== lastSecond) {

        lastSecond = seconds;

        const colorIndex =
            Math.floor(totalCentiseconds / 100) % colors.length;

        document.body.style.backgroundColor =
            colors[colorIndex];
    }

    requestAnimationFrame(updateTimer);
}

updateTimer();

</script>

</body>
</html>
